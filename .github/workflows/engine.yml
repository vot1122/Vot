name: Qwen 2.5 7B Optimized Workspace
on:
  workflow_dispatch:
  repository_dispatch:
    types: [restart-bot]

jobs:
  run-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout & Initial Setup
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT }}
          fetch-depth: 0

      - name: "Notification: Startup"
        run: |
          MSG="🚀 AI Workspace Starting (Optimized Mode)..."
          curl -d "$MSG" ntfy.sh/${{ secrets.NTFY_TOPIC }}
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} -d text="$MSG"

      - name: Decrypt & Restore Memory
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "AI Bot"
          rm -f webui.db webui.db.gpg
          git fetch origin memory || git checkout -b memory
          if [ -f "webui.db.gpg" ]; then
            gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.DB_PASSWORD }}" --output webui.db webui.db.gpg
          fi
          git checkout main

      - name: Launch AI Engine & 7B Model
        run: |
          # --- FUNCTIONS & TRAPS ---
          cleanup() {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 0 ]; then REASON="✅ Scheduled Handover Complete.";
            elif [ $EXIT_CODE -eq 137 ]; then REASON="🚨 CRASH: Out of Memory (OOM)!";
            elif [ $EXIT_CODE -eq 143 ] || [ $EXIT_CODE -eq 130 ]; then REASON="🛑 STOPPED: Manually cancelled by user.";
            else 
              docker logs open-webui 2>&1 | tail -n 100 > crash_logs.txt
              REASON="❌ CRASH: System error (Code: $EXIT_CODE). Logs attached."
              curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} -F document=@crash_logs.txt -F caption="$REASON"
            fi
            curl -d "$REASON" ntfy.sh/${{ secrets.NTFY_TOPIC }}
          }
          trap cleanup EXIT

          # --- RESOURCE OPTIMIZATION ---
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          
          # --- OLLAMA INSTALL & OPTIMIZATION ---
          curl -fsSL https://ollama.com/install.sh | sh
          
          # CPU Inference Optimizations
          export OLLAMA_HOST=0.0.0.0
          export OLLAMA_NUM_PARALLEL=1
          export OLLAMA_MAX_LOADED_MODELS=1
          export OLLAMA_KEEP_ALIVE=-1
          
          ollama serve & 
          
          # Readiness Check: Ollama API
          echo "Waiting for Ollama API..."
          until curl -s http://127.0.0.1:11434/api/tags > /dev/null; do sleep 2; done
          
          # Pull & Verify Model
          MODEL="qwen2.5:7b-instruct-q4_K_M"
          ollama pull $MODEL
          if ! ollama list | grep -q "qwen2.5"; then
            echo "Model pull failed!"
            exit 1
          fi

          # --- OPEN WEBUI SETUP ---
          docker run -d -p 8080:8080 \
            -e OLLAMA_BASE_URL=http://host.docker.internal:11434 \
            -e WEBUI_SECRET_KEY=${{ secrets.WEBUI_SECRET_KEY }} \
            --add-host=host.docker.internal:host-gateway \
            --name open-webui \
            --restart unless-stopped \
            ghcr.io/open-webui/open-webui:main
          
          if [ -f "webui.db" ]; then
            docker cp webui.db open-webui:/app/backend/data/webui.db
            docker restart open-webui
          fi

          # --- NGROK SETUP ---
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok -y
          ngrok config add-authtoken ${{ secrets.NGROK_TOKEN }}
          DOMAIN=$(echo "${{ secrets.NGROK_DOMAIN }}" | sed 's|https://||g' | sed 's|http://||g')
          ngrok http --url=$DOMAIN 127.0.0.1:8080 &

          # --- READINESS CHECKS ---
          echo "Verifying Ngrok tunnel..."
          until curl -s https://$DOMAIN > /dev/null; do sleep 5; done
          
          echo "Verifying Open WebUI health..."
          until curl -s -f http://127.0.0.1:8080 > /dev/null; do sleep 5; done

          # Run tiny inference test
          echo "Running inference warm-up..."
          TEST_START=$(date +%s%3N)
          ollama run $MODEL "hi" > /dev/null
          TEST_END=$(date +%s%3N)
          WARMUP_DUR=$((TEST_END - TEST_START))
          
          READY_MSG="✅ AI Portal ONLINE: https://$DOMAIN (Warmup: ${WARMUP_DUR}ms)"
          curl -d "$READY_MSG" ntfy.sh/${{ secrets.NTFY_TOPIC }}
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} -d text="$READY_MSG"

          # --- BACKGROUND MONITORING & SYNC ---
          (
            while true; do
              sleep 300
              # Metrics Gathering
              CPU=$(top -bn1 | grep "Cpu(s)" | sed "s/.*, *\([0-9.]*\)%* id.*/\1/" | awk '{print 100 - $1}')
              RAM=$(free -m | awk '/Mem:/ { printf("%.2f", $3/$2*100) }')
              DISK=$(df -h / | awk '/\// {print $5}')
              OLLAMA_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:11434/api/tags)
              
              METRICS="📊 *Health Report*
🖥 CPU: $CPU%
🧠 RAM: $RAM%
💾 Disk: $DISK
🤖 Ollama: $OLLAMA_STATUS
🌐 WebUI: Healthy"

              curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
                -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
                -d parse_mode="Markdown" \
                -d text="$METRICS"

              # Sync Memory Branch
              docker cp open-webui:/app/backend/data/webui.db webui.db
              rm -f webui.db.gpg
              gpg --quiet --batch --yes --symmetric --passphrase="${{ secrets.DB_PASSWORD }}" --output webui.db.gpg webui.db
              
              git fetch origin memory
              git checkout memory
              if git add webui.db.gpg && git commit -m "Sync: $(date +'%Y-%m-%d %H:%M:%S')"; then
                git push origin memory || echo "Push conflict, retrying next loop"
              fi
              git checkout main
            done
          ) &

          # --- HANDOVER LOGIC ---
          sleep 18600 # 5h 10m
          curl -d "⚠️ 10 MINUTE WARNING: Scheduled Handover Imminent" ntfy.sh/${{ secrets.NTFY_TOPIC }}
          sleep 600
          
          # Final Sync before handover
          docker cp open-webui:/app/backend/data/webui.db webui.db
          gpg --quiet --batch --yes --symmetric --passphrase="${{ secrets.DB_PASSWORD }}" --output webui.db.gpg webui.db
          git checkout memory && git add webui.db.gpg && git commit -m "Final Handover Sync" && git push origin memory || true
          
          # Trigger Restart
          curl -X POST -H "Authorization: token ${{ secrets.MY_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "restart-bot"}'
            
