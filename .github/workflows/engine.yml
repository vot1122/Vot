name: Qwen 7B Zero-Conflict Workspace
on:
  workflow_dispatch:
  repository_dispatch:
    types: [restart-bot]

jobs:
  run-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout & Initial Setup
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT }}
          fetch-depth: 0

      - name: "Notification: Startup"
        run: |
          MSG="🚀 AI Workspace Starting (Zero-Conflict Mode)..."
          curl -d "$MSG" ntfy.sh/${{ secrets.NTFY_TOPIC }}
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} -d text="$MSG"

      - name: Decrypt & Restore Memory
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "AI Bot"
          rm -f webui.db webui.db.gpg
          git fetch origin memory || git checkout -b memory
          if [ -f "webui.db.gpg" ]; then
            gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.DB_PASSWORD }}" --output webui.db webui.db.gpg
          fi
          git checkout main

      - name: Launch AI Engine & 7B Model
        run: |
          cleanup() {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 0 ]; then REASON="✅ Scheduled Handover Complete.";
            elif [ $EXIT_CODE -eq 137 ]; then REASON="🚨 CRASH: Out of Memory (OOM)!";
            elif [ $EXIT_CODE -eq 143 ] || [ $EXIT_CODE -eq 130 ]; then REASON="🛑 STOPPED: Manually cancelled by user.";
            else 
              docker logs open-webui 2>&1 | tail -n 100 > crash_logs.txt
              REASON="❌ CRASH: System error (Code: $EXIT_CODE). Logs attached."
              curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} -F document=@crash_logs.txt -F caption="$REASON"
            fi
            curl -d "$REASON" ntfy.sh/${{ secrets.NTFY_TOPIC }}
          }
          trap cleanup EXIT

          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          curl -fsSL https://ollama.com/install.sh | sh
          export OLLAMA_HOST=0.0.0.0
          ollama serve & 
          sleep 10
          ollama pull qwen2.5:7b-instruct-q4_K_M

          # Start Web Portal (No volume mount to avoid 0-byte crash)
          docker run -d -p 8080:8080 \
            -e OLLAMA_BASE_URL=http://host.docker.internal:11434 \
            -e WEBUI_SECRET_KEY=${{ secrets.WEBUI_SECRET_KEY }} \
            --add-host=host.docker.internal:host-gateway \
            --name open-webui ghcr.io/open-webui/open-webui:main
          
          # Restore database if it exists
          if [ -f "webui.db" ]; then
            docker cp webui.db open-webui:/app/backend/data/webui.db
            docker restart open-webui
          fi

          # Start Ngrok
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok -y
          ngrok config add-authtoken ${{ secrets.NGROK_TOKEN }}
          DOMAIN=$(echo "${{ secrets.NGROK_DOMAIN }}" | sed 's|https://||g' | sed 's|http://||g')
          ngrok http --url=$DOMAIN 127.0.0.1:8080 &

          # LIVE HEALTH MONITOR
          (
            while true; do
              sleep 60
              if ! docker ps | grep -q open-webui; then
                echo "Container died! Triggering cleanup."
                exit 1
              fi
              if docker logs open-webui 2>&1 | grep -q "Fetching"; then
                P=$(docker logs open-webui 2>&1 | grep "Fetching" | tail -n 1)
                curl -d "⏳ Initializing: $P" ntfy.sh/${{ secrets.NTFY_TOPIC }}
              fi
            done
          ) &

          echo "Waiting for stabilization..."
          sleep 600
          
          docker exec open-webui bash -c "echo '<script>setInterval(function(){let r=Math.max(0,19200000-(new Date().getTime()-(window.s||(window.s=new Date().getTime())))),m=Math.floor(r/60000),s=Math.floor(r%60000/1000),d=document.getElementById(\"rt\");d||((d=document.createElement(\"div\")).id=\"rt\",d.style=\"position:fixed;top:10px;right:10px;z-index:9999;padding:8px;background:rgba(0,0,0,0.8);color:white;border-radius:4px;font:12px monospace;\",document.body.appendChild(d)),d.innerHTML=\"RESTART: \"+m+\"m \"+s+\"s\",m<10&&(d.style.background=\"red\")},1000)</script>' >> /app/build/index.html" || echo "Timer skipped"
          
          until curl -s -f http://127.0.0.1:8080 > /dev/null; do sleep 10; done
          READY_MSG="✅ AI Portal ONLINE: https://$DOMAIN"
          curl -d "$READY_MSG" ntfy.sh/${{ secrets.NTFY_TOPIC }}
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} -d text="$READY_MSG"

          # ACTIVITY MONITOR & SYNC
          (
            while true; do
              sleep 300
              docker cp open-webui:/app/backend/data/webui.db webui.db
              rm -f webui.db.gpg
              gpg --quiet --batch --yes --symmetric --passphrase="${{ secrets.DB_PASSWORD }}" --output webui.db.gpg webui.db
              git checkout memory && git add webui.db.gpg && git commit -m "Sync" && git push origin memory || echo "No change"
              git checkout main
            done
          ) &

          sleep 18600
          curl -d "⚠️ 10 MINUTE WARNING!" ntfy.sh/${{ secrets.NTFY_TOPIC }}
          sleep 600
          curl -X POST -H "Authorization: token ${{ secrets.MY_PAT }}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/dispatches -d '{"event_type": "restart-bot"}'
              git checkout main
            done
          ) &

          sleep 18600
          curl -d "⚠️ 10 MINUTE WARNING!" ntfy.sh/${{ secrets.NTFY_TOPIC }}
          sleep 600
          curl -X POST -H "Authorization: token ${{ secrets.MY_PAT }}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/dispatches -d '{"event_type": "restart-bot"}'
              git checkout main
            done
          ) &

          sleep 18600
          curl -d "⚠️ 10 MINUTE WARNING!" ntfy.sh/${{ secrets.NTFY_TOPIC }}
          sleep 600
          curl -X POST -H "Authorization: token ${{ secrets.MY_PAT }}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/dispatches -d '{"event_type": "restart-bot"}'
